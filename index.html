<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你点不到我~</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45, #1e1e2f);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: crosshair;
    user-select: none;
  }

  @keyframes bgMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    color: #fff;
    font-size: 2rem;
    margin-bottom: 2rem;
    text-shadow: 0 0 12px #7b68ee;
    animation: float 2.5s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }

  #hint {
    color: #aaa;
    margin-top: 2rem;
    font-size: 0.95rem;
    height: 1.2em;
  }

  /* 逃跑按钮 */
  #btn {
    position: fixed;
    padding: 16px 42px;
    font-size: 1.2rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(45deg, #ff5f6d, #ffc371);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,95,109,.5);
    transition: transform .12s ease;
    will-change: left, top;
    z-index: 10;
  }

  #btn:active { transform: scale(.95); }

  /* 成功点中后的弹窗 */
  #popup {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.6);
    z-index: 100;
  }

  #popup.show { display: flex; }

  .card {
    background: #fff;
    padding: 40px 50px;
    border-radius: 20px;
    text-align: center;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: pop .3s ease;
  }

  @keyframes pop {
    from { transform: scale(.7); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  .card .emoji { font-size: 3.5rem; }
  .card h2 { margin: 12px 0; color: #333; }
  .card p  { color: #777; margin-bottom: 22px; line-height: 1.6; }

  .card button {
    padding: 12px 34px;
    font-size: 1rem;
    color: #fff;
    background: #7b68ee;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: .2s;
  }
  .card button:hover { background: #6a57d6; }
</style>
</head>
<body>

  <h1>😜 来抓我呀，抓到算我输</h1>
  <button id="btn">点我呀 →</button>
  <div id="hint"></div>

  <!-- 弹窗 -->
  <div id="popup">
    <div class="card">
      <div class="emoji">🤡</div>
      <h2>哈哈，你上当了！</h2>
      <p>其实这个按钮本来就不想被点到，<br>你却这么执着……</p>
      <button onclick="location.reload()">再玩一次</button>
    </div>
  </div>

<script>
  const btn   = document.getElementById('btn');
  const hint  = document.getElementById('hint');
  const popup = document.getElementById('popup');

  const teases = [
    "太慢啦~ 再快点！",
    "就这？我还没用力呢",
    "你手速还行，可惜我更溜 😏",
    "再试试？我保证这次不跑（才怪）",
    "别放弃嘛，很好玩的",
    "是不是很气？哈哈哈哈哈",
    "抓到我，我就……继续跑"
  ];

  let count = 0;
  const MOVE_RADIUS = 110;   // 鼠标离多近按钮开始逃
  const JUMP = 140;          // 每次逃多远

  // 初始化按钮位置：屏幕中心
  function placeCenter() {
    btn.style.left = (window.innerWidth  / 2 - btn.offsetWidth  / 2) + 'px';
    btn.style.top  = (window.innerHeight / 2 - btn.offsetHeight / 2) + 'px';
  }
  placeCenter();

  // 计算按钮中心点
  function center(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // 判断鼠标是否太近，太近就跳走
  function maybeRun(mx, my) {
    const c = center(btn);
    const dx = c.x - mx;
    const dy = c.y - my;
    const dist = Math.hypot(dx, dy);

    if (dist < MOVE_RADIUS) {
      escape(mx, my);
    }
  }

  // 逃跑逻辑
  function escape(mx, my) {
    const w = window.innerWidth,  h = window.innerHeight;
    const bw = btn.offsetWidth,   bh = btn.offsetHeight;
    const c  = center(btn);

    // 朝远离鼠标的方向跳
    let nx = c.x + Math.sign(c.x - mx || 1) * JUMP;
    let ny = c.y + Math.sign(c.y - my || 1) * JUMP;

    // 加点随机，别太规律
    nx += (Math.random() - 0.5) * 180;
    ny += (Math.random() - 0.5) * 180;

    // 夹在屏幕内
    nx = Math.max(10, Math.min(w - bw - 10, nx - bw / 2));
    ny = Math.max(10, Math.min(h - bh - 10, ny - bh / 2));

    btn.style.left = nx + 'px';
    btn.style.top  = ny + 'px';

    hint.textContent = teases[count % teases.length];
    count++;
  }

  // 鼠标移动 -> 触发逃跑
  document.addEventListener('mousemove', e => {
    maybeRun(e.clientX, e.clientY);
  });

  // 手机端：手指靠近也能逃
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    maybeRun(t.clientX, t.clientY);
  }, { passive: true });

  // 万一真被点到了（比如键盘/脚本），给点面子
  btn.addEventListener('click', () => {
    hint.textContent = "？？你怎么真点到了 😐";
    popup.classList.add('show');
  });

  // 键盘党：按钮也可以用 Tab 聚焦，回车触发
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter') popup.classList.add('show');
  });
</script>
</body>
</html>
